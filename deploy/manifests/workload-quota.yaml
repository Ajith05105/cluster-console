# A ceiling on what the `workload` namespace may ask for in total, so a typo
# in the console (say, 5 CPUs per pod) cannot swamp the cluster.
#
# Sized so that a whole node's pods can overlap with their replacements.
# When a node dies, its pods go on counting against this quota for the few
# seconds they are given to shut down, and the replacements are created in
# that same moment. So the quota must hold both sets at once, or the
# replacements are refused.
#
# That happened on 2026-10-09 with the earlier limits (30 pods, 12 CPUs):
# 12 pods on a dead node plus 12 others reached exactly 12 CPUs at 500m each,
# 7 replacements were refused, and Kubernetes did not try again for minutes.
#
# The CPU figure also leaves room for larger pods (up to 800m each has been
# used). Pods still cannot be scheduled beyond what the nodes really have, so
# this remains a guard against typos, not the thing that limits capacity.
#
# Because this quota counts CPU requests, memory requests and memory limits,
# every pod in the namespace must declare all three or it is refused.
#
# The console is deliberately NOT allowed to create, edit or delete this
# object. Only Argo CD (from this file) and the owner can change it.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workload-quota
  namespace: workload
spec:
  hard:
    pods: "60"
    requests.cpu: "32"
    requests.memory: 8Gi
    limits.memory: 16Gi
