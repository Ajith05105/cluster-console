# The console itself: storage for its CSV files, the program, an in-cluster
# address for it, and a Traefik route so a browser can reach it.
#
# Before this can accept changes, the owner creates the access token Secret
# (see deploy/README.md). Without it the console still starts and shows the
# cluster, but refuses every POST.

# Storage for the CSV files, so they survive the console pod restarting.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: console-data
  namespace: console
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: console
  labels:
    app: console
spec:
  replicas: 1
  # Stop the old pod before starting a new one: the storage above can only be
  # attached to one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      # The identity the console uses to talk to Kubernetes. What it may do
      # is in console-rbac.yaml.
      serviceAccountName: console

      # Run on server-1. The console and its load generator must not sit on
      # a worker in the test pool, or they would compete with the workload
      # they are measuring. server-1 was chosen in Phase 0: it does not host
      # Traefik (server-2) or Prometheus and Gitea (server-3).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - server-1

      imagePullSecrets:
        - name: gitea-registry-pull

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: console
          image: gitea.cluster.local:3000/apps/cluster-console:0.3.0
          ports:
            - name: http
              containerPort: 8080
          env:
            # The shared access token every POST must present. It comes from
            # a Secret the owner creates; it is never written in this repo.
            # "optional" lets the console start without it (changes are then
            # switched off until the Secret exists and the pod is restarted).
            - name: CONSOLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: console-token
                  key: token
                  optional: true
            # The read-only switch. Set to "true" to refuse every POST even
            # with the right token.
            - name: READ_ONLY
              value: "false"
            - name: DATA_DIR
              value: /data
            # Where the load generator sends frames: Traefik's in-cluster
            # address, with the route's host name as a header. The host name
            # itself does not resolve inside the cluster.
            - name: LOAD_TARGET_URL
              value: http://traefik.kube-system.svc.cluster.local
            - name: LOAD_HOST
              value: workload.cluster.local
            # The most the load generator may be asked for, in frames per
            # second (cameras x fps).
            - name: LOAD_MAX_RATE
              value: "600"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            # The CPU limit stops a runaway load generator from starving the
            # control-plane services that share this node.
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: console-data
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: console
  labels:
    app: console
spec:
  selector:
    app: console
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The route for browsers: http://console.cluster.local through Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  namespace: console
  labels:
    app: console
spec:
  ingressClassName: traefik
  rules:
    - host: console.cluster.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: console
                port:
                  name: http
